# Flash work tier uses Sonnet as a reference, prioritizes task cost, and tracks
# tokens/latency; it has no strict intelligence ceiling and is not a name filter.
# These are unranked candidates: platform task economics and BIM quality are unverified.
# Broader vision/OCR/retrieval candidates: AI_agent/logs/experiments/
# 2026-09-28_model_capability_research/candidates.json (research, not a scheduler).
# Candidate profiles screened on 2026-09-28, not an adopted BIM quality baseline.
# Explicit opt-in for existing API consumers via EP_AGENT_LLM_CONFIG.
# The subscription-only run_bim_agent entry point does not consume this file.
# Endpoint/key stay separate from Claude/GLM subscription environment variables.
default: &local_main
  provider: openai
  base_url: ${oc.env:PARATERA_BASE_URL,https://llmapi.paratera.com/v1}
  api_key: ${oc.env:PARATERA_API_KEY,null}
  model_name: Qwen3.8-27B
  temperature: 0.7
  max_tokens: 16384
  extra_body:
    enable_thinking: true

# Role names are selectable configurations, not a mandatory multi-agent flow.
local_main: *local_main

local_alternative:
  <<: *local_main
  model_name: Qwen3.5-35B-A3B

flash_assist:
  <<: *local_main
  model_name: Qwen3.8-Flash

flash_crosscheck:
  <<: *local_main
  model_name: GLM-5.3-Flash
  extra_body:
    reasoning_effort: low

# Setup-only profiles matching the exact lightweight protocol probe.
# Thinking-enabled long tasks are not certified by the non-thinking smoke test.
connection_check:
  <<: *local_main
  max_tokens: 1024
  extra_body:
    enable_thinking: false
